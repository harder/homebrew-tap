name: Validate formula

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      auto_merge_pr:
        description: 'Automation PR number to merge after both platform checks pass'
        required: false
        type: string

permissions:
  contents: read

jobs:
  skillview:
    name: SkillView (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - name: Set up Homebrew and check out tap
        uses: Homebrew/actions/setup-homebrew@848c272c7bfe984a197bd4d16383f4c106ec61e6 # 2026.09.21.1
        with:
          core: true
      - name: Audit, install, and test SkillView
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew audit harder/tap/skillview
          brew install harder/tap/skillview
          brew test harder/tap/skillview
          skillview --version
          skillview --help

  merge-validated-update:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.auto_merge_pr != '' }}
    needs: skillview
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge only the validated formula update
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.auto_merge_pr }}
          VALIDATED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          pr=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json state,baseRefName,headRefName,headRefOid,isCrossRepository,author)
          test "$(jq -r '.state' <<< "$pr")" = OPEN
          test "$(jq -r '.baseRefName' <<< "$pr")" = main
          test "$(jq -r '.isCrossRepository' <<< "$pr")" = false
          test "$(jq -r '.headRefOid' <<< "$pr")" = "$VALIDATED_SHA"
          [[ "$(jq -r '.headRefName' <<< "$pr")" =~ ^automation/skillview-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          author=$(jq -r '.author.login' <<< "$pr")
          [[ "$author" == "app/github-actions" || "$author" == "github-actions[bot]" ]]
          files=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json files --jq '.files[].path')
          test "$files" = Formula/skillview.rb
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --squash --delete-branch --match-head-commit "$VALIDATED_SHA"
